<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{page_title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  {{#if robots}}<meta name="robots" content="{{robots}}">{{/if}}
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <script>
  // Runs before anything else on the page, including the Meta Pixel: move the email out of the address bar
  // so it is never sent to Meta, YouTube or Selar inside a page URL.
  (function () {
    try {
      var u = new URL(location.href), e = u.searchParams.get('e');
      if (e === null) return;
      e = e.trim().toLowerCase();
      if (e.length <= 200 && /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)) { try { localStorage.setItem('qc_email', e); } catch (x) {} }
      u.searchParams.delete('e');
      history.replaceState(null, '', u.pathname + u.search + u.hash);
    } catch (x) {}
  })();
  </script>
  {{{prev_next_links}}}
  <link rel="icon" type="image/png" href="{{logo_path}}">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">

  <meta property="og:site_name" content="{{publisher_name}}">
  <meta property="og:type" content="{{og_type}}">
  <meta property="og:title" content="{{og_title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{og_image}}">
  {{{article_meta}}}
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{og_title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{og_image}}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&amp;family=Lato:wght@400;700&amp;family=Poppins:wght@700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/brand.css">
  <link rel="stylesheet" href="/assets/css/site.css">
  <link rel="stylesheet" href="/assets/css/quickclass.css">
  {{{jsonld}}}
  {{> meta-pixel}}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {{#if draft_banner}}<div class="draft-banner">Draft preview. This page is not on the live site.</div>{{/if}}
  {{> header-replay}}
  <main id="main">
{{{content}}}
  </main>
  {{> footer-sales}}
  <script type="module" src="/assets/js/quickclass.js"></script>
</body>
</html>
