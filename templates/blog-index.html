<section class="hero hero--short blog-hero">
  <div class="wrap">
    <p class="eyebrow">Blog</p>
    <h1>{{heading}}</h1>
    <p class="lead">{{blog_description}}</p>

    <form id="blog-search" class="filters" role="search" hidden>
      <div class="field field--search">
        <label for="q" class="visually-hidden">Search posts</label>
        <input id="q" name="q" type="search" placeholder="Search posts by keyword or topic" autocomplete="off">
      </div>
      <div class="field field--topic">
        <label for="topic" class="visually-hidden">Filter by topic</label>
        <select id="topic" name="topic">
          <option value="">All topics ({{total_posts}})</option>
{{#each tags_all}}          <option value="{{name}}">{{name}} ({{count}})</option>
{{/each}}        </select>
      </div>
      <button type="button" id="clear-filters" class="clear-btn" hidden>Clear</button>
    </form>

    <noscript>
      <ul class="tag-list tag-list--row" aria-label="Topics">
{{#each tags_all}}        <li><a class="chip" href="{{url}}">{{name}} <span>{{count}}</span></a></li>
{{/each}}      </ul>
    </noscript>
  </div>
</section>

<section class="section blog-list">
  <div class="wrap">
    <p id="blog-status" class="blog-status" role="status" aria-live="polite" hidden></p>
    <div id="blog-results" hidden></div>
    <div id="blog-default">
      <ul class="cards" id="post-list">
{{#each posts}}        <li class="card card--post">
          {{{thumb}}}
          <div class="card-body">
            {{{label_html}}}
            <h2><a href="{{url}}">{{title}}</a></h2>
            <p>{{summary}}</p>
            <p class="meta"><time datetime="{{date}}">{{date_display}}</time> &middot; {{reading_time}} min read</p>
          </div>
        </li>
{{/each}}      </ul>
      {{{pager}}}
    </div>
  </div>
</section>
<script>
(function () {
  var form = document.getElementById("blog-search");
  if (!form || !window.fetch) return;
  form.hidden = false;
  var input = document.getElementById("q"), topic = document.getElementById("topic"), clear = document.getElementById("clear-filters");
  var status = document.getElementById("blog-status");
  var results = document.getElementById("blog-results"), normal = document.getElementById("blog-default");
  var data = null, ticket = 0, state = { q: "", tag: "" };

  function load() {
    if (data) return Promise.resolve(data);
    return fetch("/blog/search.json").then(function (r) { return r.json(); }).then(function (d) { data = d; return d; });
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
  function matches(p) {
    if (state.tag && p.tags.indexOf(state.tag) < 0) return false;
    var words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    var hay = (p.title + " " + p.summary + " " + p.tags.join(" ")).toLowerCase();
    return words.every(function (w) { return hay.indexOf(w) >= 0; });
  }
  function sync() {
    var qs = [];
    if (state.q) qs.push("q=" + encodeURIComponent(state.q));
    if (state.tag) qs.push("tag=" + encodeURIComponent(state.tag));
    history.replaceState(null, "", location.pathname + (qs.length ? "?" + qs.join("&") : ""));
    topic.value = state.tag;
    clear.hidden = !(state.q || state.tag);
  }
  function card(p) {
    var li = el("li", "card card--post");
    if (p.image) {
      var ta = el("a", "card-thumb"); ta.href = p.url; ta.tabIndex = -1; ta.setAttribute("aria-hidden", "true");
      var im = el("img"); im.src = p.image; im.alt = p.title; im.width = 1200; im.height = 630; im.loading = "lazy";
      ta.appendChild(im); li.appendChild(ta);
    }
    var body = el("div", "card-body");
    if (p.tags[0]) body.appendChild(el("p", "label", p.tags[0]));
    var h = el("h2"), a = el("a", "", p.title); a.href = p.url; h.appendChild(a);
    body.appendChild(h);
    body.appendChild(el("p", "", p.summary));
    body.appendChild(el("p", "meta", p.date_display + " · " + p.reading_time + " min read"));
    li.appendChild(body);
    return li;
  }
  function render() {
    var mine = ++ticket;
    sync();
    if (!state.q && !state.tag) { results.hidden = true; status.hidden = true; normal.hidden = false; return; }
    load().then(function (posts) {
      if (mine !== ticket) return; // a newer search or filter replaced this one
      var found = posts.filter(matches);
      results.textContent = "";
      var ul = el("ul", "cards");
      found.forEach(function (p) { ul.appendChild(card(p)); });
      results.appendChild(ul);
      var what = (state.tag ? "“" + state.tag + "”" : "") + (state.tag && state.q ? " and " : "") + (state.q ? "“" + state.q + "”" : "");
      status.textContent = found.length ? found.length + (found.length === 1 ? " post for " : " posts for ") + what + "." : "No posts match " + what + ". Try fewer words or clear the filters.";
      status.hidden = false; results.hidden = false; normal.hidden = true;
    }).catch(function () { normal.hidden = false; });
  }
  form.addEventListener("submit", function (e) { e.preventDefault(); });
  input.addEventListener("input", function () { state.q = input.value.trim(); render(); });
  topic.addEventListener("change", function () { state.tag = topic.value; render(); });
  clear.addEventListener("click", function () { state.q = ""; state.tag = ""; input.value = ""; render(); input.focus(); });
  var params = new URLSearchParams(location.search);
  state.q = params.get("q") || ""; state.tag = params.get("tag") || "";
  input.value = state.q;
  render();
})();
</script>
