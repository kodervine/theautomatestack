{{#if meta_pixel_id}}<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '{{meta_pixel_id}}');
fbq('track', 'PageView');
(function () {
  var data = {{{pixel_json}}};
  // A setup page: tell Meta which product is being viewed.
  if (data.content_ids) fbq('track', 'ViewContent', data);
  // Someone presses a buy button, on their way to Selar.
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a.btn--big');
    if (a && data.content_ids) fbq('track', 'InitiateCheckout', data);
  }, { passive: true });
  // The page Selar sends buyers back to after paying. Counted once per visit, and only when a setup is named in the link.
  var m = /^\/before-you-go\/?$/.test(location.pathname) && new URLSearchParams(location.search).get('setup');
  if (m) {
    try { if (sessionStorage.getItem('px-purchase-' + m)) return; sessionStorage.setItem('px-purchase-' + m, '1'); } catch (x) {}
    fbq('track', 'Purchase', { content_ids: [m], currency: 'NGN', value: {{purchase_value}} });
  }
})();
</script>
<noscript><img height="1" width="1" style="display:none" alt="" src="https://www.facebook.com/tr?id={{meta_pixel_id}}&amp;ev=PageView&amp;noscript=1"></noscript>{{/if}}
