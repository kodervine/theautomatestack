{{#if meta_pixel_id}}<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '{{meta_pixel_id}}');
fbq('track', 'PageView');
(function () {
  var data = {{{pixel_json}}};
  var page = data.page;
  delete data.page;
  // Keep the ad's UTM tags for the whole visit, so they survive a reload and the trip to checkout and back.
  var utm = {};
  try {
    var q = new URLSearchParams(location.search);
    ['utm_source', 'utm_medium', 'utm_campaign'].forEach(function (k) { if (q.get(k)) utm[k] = q.get(k); });
    if (Object.keys(utm).length) sessionStorage.setItem('replay-utm', JSON.stringify(utm));
    else utm = JSON.parse(sessionStorage.getItem('replay-utm') || '{}');
  } catch (x) {}
  // Pass the tags on to the checkout link.
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('a[data-checkout]').forEach(function (a) {
      try {
        var u = new URL(a.getAttribute('href'), location.href);
        Object.keys(utm).forEach(function (k) { if (!u.searchParams.has(k)) u.searchParams.set(k, utm[k]); });
        a.setAttribute('href', u.toString());
      } catch (x) {}
    });
  });
  var withUtm = function (o) { Object.keys(utm).forEach(function (k) { o[k] = utm[k]; }); return o; };
  if (page === 'sales') {
    fbq('track', 'ViewContent', withUtm(Object.assign({}, data)));
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[data-checkout]');
      if (a) fbq('track', 'InitiateCheckout', withUtm(Object.assign({}, data)));
    }, { passive: true });
  }
  // The page Selar sends buyers to after paying. Counted once per visit.
  if (page === 'thanks') {
    try { if (sessionStorage.getItem('px-purchase-replay')) return; sessionStorage.setItem('px-purchase-replay', '1'); } catch (x) {}
    fbq('track', 'Purchase', withUtm(Object.assign({}, data)));
  }
})();
</script>
<noscript><img height="1" width="1" style="display:none" alt="" src="https://www.facebook.com/tr?id={{meta_pixel_id}}&amp;ev=PageView&amp;noscript=1"></noscript>{{/if}}
