<section class="hero sales-hero hero--stack">
  <div class="wrap hero-stack">
    {{#if hero_eyebrow}}<p class="eyebrow">{{hero_eyebrow}}</p>{{/if}}
    {{#if hero_callout}}<p class="callout">{{hero_callout}}</p>{{/if}}
    <h1 class="{{h1_class}}">{{hero_title}}</h1>
    <p class="lead">{{hero_sub}}</p>
    <div class="hero-clips">
{{#each hero_clips}}      <figure class="hero-clip">
        <video autoplay muted loop playsinline preload="metadata" poster="{{poster}}" aria-label="{{alt}}">
          <source src="{{src}}" type="video/mp4">
        </video>
        <figcaption>{{label}}</figcaption>
      </figure>
{{/each}}    </div>
    <p class="clip-tap">{{hero_tap}}</p>
    <script>(function(){var m=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;document.querySelectorAll(".hero-clip video").forEach(function(v){if(m){v.removeAttribute("autoplay");v.pause();}v.addEventListener("click",function(){var on=v.muted;document.querySelectorAll(".hero-clip video").forEach(function(o){o.muted=true;});v.muted=!on;if(on){v.currentTime=0;v.play();}});});})();</script>
    <div class="actions">
      <a class="btn btn--big" href="#inside">{{hero_cta}}</a>
    </div>
  </div>
</section>

<section class="section">
  <div class="wrap read-wide prose reveal">
    <h2>{{reviews_title}}</h2>
    {{{reviews_html}}}
{{> kit-cta}}
  </div>
</section>
