<aside class="author" aria-labelledby="author-heading">
  <div class="avatar" aria-hidden="true">{{author_initial}}</div>
  <div>
    <h2 id="author-heading">{{author_name}}</h2>
    <p>{{author_bio}}</p>
    <div class="socials">
      <a href="{{instagram_url}}" rel="noopener">Instagram</a>
      <a href="{{tiktok_url}}" rel="noopener">TikTok</a>
      <a href="{{youtube_url}}" rel="noopener">YouTube</a>
    </div>
  </div>
</aside>
