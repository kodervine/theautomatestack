<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">Is your inbox ready for Black Friday?</title>
  <desc id="d">A five-step checklist. Write down your offer and the questions buyers will ask. Write your answers once, in your voice. Add a checkout link and a backup payment option. Test it with ten messy messages. Decide what happens when it does not know.</desc>
  <rect width="1200" height="630" fill="#FBF9F4"/>
  <rect width="1200" height="8" fill="#C8996C"/>
  <text x="60" y="84" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="50" fill="#1A1110">Is your inbox ready for Black Friday?</text>
  <text x="60" y="124" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#746C61">Black Friday is on 27 November. Start now.</text>

  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="28" fill="#1A1110">
    <rect x="60" y="156" width="1080" height="66" rx="12" fill="#FFFFFF" stroke="#746C61" stroke-width="2"/>
    <rect x="84" y="174" width="30" height="30" rx="6" fill="none" stroke="#C8996C" stroke-width="3"/><path d="M91 190 l7 8 l13 -16" fill="none" stroke="#C8996C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="136" y="199">Write down your offer and the questions buyers will ask</text>

    <rect x="60" y="234" width="1080" height="66" rx="12" fill="#FFFFFF" stroke="#746C61" stroke-width="2"/>
    <rect x="84" y="252" width="30" height="30" rx="6" fill="none" stroke="#C8996C" stroke-width="3"/><path d="M91 268 l7 8 l13 -16" fill="none" stroke="#C8996C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="136" y="277">Write your answers once, in your voice</text>

    <rect x="60" y="312" width="1080" height="66" rx="12" fill="#FFFFFF" stroke="#746C61" stroke-width="2"/>
    <rect x="84" y="330" width="30" height="30" rx="6" fill="none" stroke="#C8996C" stroke-width="3"/><path d="M91 346 l7 8 l13 -16" fill="none" stroke="#C8996C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="136" y="355">Add a checkout link and a backup payment option</text>

    <rect x="60" y="390" width="1080" height="66" rx="12" fill="#FFFFFF" stroke="#746C61" stroke-width="2"/>
    <rect x="84" y="408" width="30" height="30" rx="6" fill="none" stroke="#C8996C" stroke-width="3"/><path d="M91 424 l7 8 l13 -16" fill="none" stroke="#C8996C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="136" y="433">Test it with ten messy messages</text>

    <rect x="60" y="468" width="1080" height="66" rx="12" fill="#1A1110"/>
    <rect x="84" y="486" width="30" height="30" rx="6" fill="none" stroke="#C8996C" stroke-width="3"/><path d="M91 502 l7 8 l13 -16" fill="none" stroke="#C8996C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="136" y="511" fill="#FBF9F4">Decide what happens when it does not know</text>
  </g>
  <text x="60" y="598" font-family="Poppins, Arial, Helvetica, sans-serif" font-weight="700" font-size="16" letter-spacing="3" fill="#746C61">THEAUTOMATESTACK</text>
</svg>
