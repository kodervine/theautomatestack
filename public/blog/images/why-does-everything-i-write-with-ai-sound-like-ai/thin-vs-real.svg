<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">Why AI sounds like AI</title>
  <desc id="d">Two paths. A thin input, write me a post about pricing, gives a flat post that sounds like AI. Your own words and rules give a post that sounds like you.</desc>
  <rect width="1200" height="630" fill="#FBF9F4"/>
  <rect width="1200" height="8" fill="#C8996C"/>
  <text x="60" y="84" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="52" fill="#1A1110">Why AI sounds like AI</text>
  <text x="60" y="124" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#746C61">It can only reshape what you give it.</text>

  <text x="60" y="190" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" letter-spacing="2" fill="#746C61">THIN INPUT</text>
  <rect x="60" y="204" width="520" height="116" rx="12" fill="#FFFFFF" stroke="#746C61" stroke-width="2"/>
  <text x="92" y="272" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="29" fill="#1A1110">"Write me a post about pricing."</text>
  <path d="M320 320 V372" stroke="#746C61" stroke-width="4" fill="none"/>
  <polygon points="320,384 308,364 332,364" fill="#746C61"/>
  <rect x="60" y="392" width="520" height="116" rx="12" fill="#746C61"/>
  <text x="92" y="458" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="29" fill="#FBF9F4">A flat post that sounds like AI.</text>

  <text x="620" y="190" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" letter-spacing="2" fill="#C8996C">YOUR OWN WORDS</text>
  <rect x="620" y="204" width="520" height="116" rx="12" fill="#FFFFFF" stroke="#C8996C" stroke-width="3"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="27" fill="#1A1110">
    <tspan x="652" y="254">One lesson you teach, in 3 to 6</tspan>
    <tspan x="652" y="290">sentences, plus your rules.</tspan>
  </text>
  <path d="M880 320 V372" stroke="#C8996C" stroke-width="4" fill="none"/>
  <polygon points="880,384 868,364 892,364" fill="#C8996C"/>
  <rect x="620" y="392" width="520" height="116" rx="12" fill="#1A1110"/>
  <text x="652" y="458" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="29" fill="#C8996C">A post that sounds like you.</text>

  <text x="60" y="590" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1A1110">Then read it out loud and cross out anything you would never say.</text>
  <text x="60" y="618" font-family="Poppins, Arial, Helvetica, sans-serif" font-weight="700" font-size="16" letter-spacing="3" fill="#746C61">THEAUTOMATESTACK</text>
</svg>
