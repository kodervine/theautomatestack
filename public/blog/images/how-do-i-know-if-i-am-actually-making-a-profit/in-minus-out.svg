<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">Money in minus money out equals what you kept</title>
  <desc id="d">Track money in and money out in the same sheet, then subtract to see what you kept.</desc>
  <rect width="1200" height="630" fill="#FBF9F4"/>
  <rect width="1200" height="8" fill="#C8996C"/>
  <text x="60" y="84" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="50" fill="#1A1110">Busy is not the same as profit</text>
  <text x="60" y="124" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#746C61">See both sides in one sheet.</text>
  <rect x="60" y="170" width="330" height="230" rx="12" fill="#FFFFFF" stroke="#746C61" stroke-width="2"/>
  <text x="82" y="222" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="44" fill="#C8996C">IN</text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#1A1110"><tspan x="82" y="270">Money in</tspan><tspan x="82" y="302">every payment</tspan></text>
  <text x="415" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="56" fill="#C8996C">-</text>
  <rect x="440" y="170" width="330" height="230" rx="12" fill="#FFFFFF" stroke="#746C61" stroke-width="2"/>
  <text x="462" y="222" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="44" fill="#C8996C">OUT</text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#1A1110"><tspan x="462" y="270">Money out</tspan><tspan x="462" y="302">stock, delivery, ads</tspan></text>
  <text x="795" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="56" fill="#C8996C">=</text>
  <rect x="820" y="170" width="320" height="230" rx="12" fill="#1A1110"/>
  <text x="842" y="222" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="44" fill="#C8996C">KEPT</text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#FBF9F4"><tspan x="842" y="270">What you</tspan><tspan x="842" y="302">actually kept</tspan></text>
  <rect x="60" y="470" width="1080" height="84" rx="12" fill="#1A1110"/>
  <text x="600" y="523" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="28" fill="#C8996C">Track both sides, once a month, in the same sheet.</text>
  <text x="60" y="600" font-family="Poppins, Arial, Helvetica, sans-serif" font-weight="700" font-size="16" letter-spacing="3" fill="#746C61">THEAUTOMATESTACK</text>
</svg>
