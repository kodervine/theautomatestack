<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">AI drafts, you approve, then it is scheduled</title>
  <desc id="d">AI drafts the content, you read, fix and approve it, and only then is it scheduled. Nothing is posted without you.</desc>
  <rect width="1200" height="630" fill="#FBF9F4"/>
  <rect width="1200" height="8" fill="#C8996C"/>
  <text x="60" y="84" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="50" fill="#1A1110">AI drafts. You approve.</text>
  <text x="60" y="124" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#746C61">Nothing goes out unless you have looked at it.</text>
  <rect x="60" y="170" width="340" height="230" rx="12" fill="#FFFFFF" stroke="#746C61" stroke-width="2"/>
  <text x="82" y="222" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="44" fill="#C8996C">1</text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#1A1110"><tspan x="82" y="270">AI drafts</tspan><tspan x="82" y="302">hooks and captions</tspan></text>
  <polygon points="407,275 407,299 425,287" fill="#C8996C"/>
  <rect x="430" y="170" width="340" height="230" rx="12" fill="#1A1110"/>
  <text x="452" y="222" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="44" fill="#C8996C">2</text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#FBF9F4"><tspan x="452" y="270">You read, fix</tspan><tspan x="452" y="302">and approve</tspan></text>
  <polygon points="777,275 777,299 795,287" fill="#C8996C"/>
  <rect x="800" y="170" width="340" height="230" rx="12" fill="#FFFFFF" stroke="#746C61" stroke-width="2"/>
  <text x="822" y="222" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="44" fill="#C8996C">3</text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#1A1110"><tspan x="822" y="270">Then it is</tspan><tspan x="822" y="302">scheduled</tspan></text>
  <rect x="60" y="470" width="1080" height="84" rx="12" fill="#1A1110"/>
  <text x="600" y="523" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="28" fill="#C8996C">Check every price, date, name and claim before you approve.</text>
  <text x="60" y="600" font-family="Poppins, Arial, Helvetica, sans-serif" font-weight="700" font-size="16" letter-spacing="3" fill="#746C61">THEAUTOMATESTACK</text>
</svg>
