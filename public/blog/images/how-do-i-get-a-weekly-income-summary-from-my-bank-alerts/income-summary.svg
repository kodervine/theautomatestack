<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">Bank alerts into a weekly summary</title>
  <desc id="d">You paste your bank alerts in, AI adds them up, and you get one message with your week's income. Remove account numbers before you paste.</desc>
  <rect width="1200" height="630" fill="#FBF9F4"/>
  <rect width="1200" height="8" fill="#C8996C"/>
  <text x="60" y="84" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="50" fill="#1A1110">Bank alerts into a weekly summary</text>
  <text x="60" y="124" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#746C61">Less adding up by hand.</text>
  <rect x="60" y="170" width="340" height="230" rx="12" fill="#FFFFFF" stroke="#746C61" stroke-width="2"/>
  <text x="84" y="226" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="48" fill="#C8996C">1</text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#1A1110"><tspan x="84" y="280">Bank alerts</tspan><tspan x="84" y="312">you paste in</tspan></text>
  <polygon points="407,275 407,299 425,287" fill="#C8996C"/>
  <rect x="430" y="170" width="340" height="230" rx="12" fill="#FFFFFF" stroke="#746C61" stroke-width="2"/>
  <text x="454" y="226" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="48" fill="#C8996C">2</text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#1A1110"><tspan x="454" y="280">AI adds</tspan><tspan x="454" y="312">them up</tspan></text>
  <polygon points="777,275 777,299 795,287" fill="#C8996C"/>
  <rect x="800" y="170" width="340" height="230" rx="12" fill="#1A1110"/>
  <text x="824" y="226" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="48" fill="#C8996C">3</text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#FBF9F4"><tspan x="824" y="280">One message</tspan><tspan x="824" y="312">with your</tspan><tspan x="824" y="344">week's income</tspan></text>
  <rect x="60" y="440" width="1080" height="96" rx="12" fill="#1A1110"/>
  <text x="600" y="499" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="30" fill="#C8996C">Remove account numbers before you paste.</text>
  <text x="60" y="600" font-family="Poppins, Arial, Helvetica, sans-serif" font-weight="700" font-size="16" letter-spacing="3" fill="#746C61">THEAUTOMATESTACK</text>
</svg>
